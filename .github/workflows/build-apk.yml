# Nightly 测试包构建：每天北京时间 0 点（UTC 16:00）定时跑一次，另支持手动触发。
# 按作者要求（PR #113）：不打 tag、不发 GitHub Release，产物仅上传为 Actions Artifacts，
# 供每日最新 master 的尝鲜测试，不污染正式版本号与更新检测。
# 签名：Release 包用仓库 Secrets 里的正式证书签名（KEYSTORE_BASE64 / KEYSTORE_PASSWORD /
# KEY_ALIAS / KEY_PASSWORD），与正式版同签名 ⇒ 测试包可直接覆盖安装升级；
# 本地构建没有这些变量，app/build.gradle.kts 会把 release 变体置为未签名（app-release-unsigned.apk）。
name: Nightly Build APK

on:
  # UTC 16:00 = 北京时间 00:00
  schedule:
    - cron: '0 16 * * *'
  # 支持在 Actions 页手动触发
  workflow_dispatch:

# 只上传 Artifacts，不写 Release/tag：读权限即可（最小权限原则）
permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要 git 历史与 gh CLI 才能比对最近成功构建的 SHA、读取 default branch HEAD
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 防重复：若 master 自上次成功构建以来没有新提交，则跳过本次 nightly，
      # 避免每天定时跑出完全相同的包。手动 workflow_dispatch 也会受此保护（无新提交即跳过）。
      - name: Skip if master has no new commit since last successful build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git fetch origin master --quiet
          HEAD_SHA=$(git rev-parse origin/master)
          echo "当前 master HEAD: $HEAD_SHA"

          # 最近一次本 workflow 成功 run 的 headSha（gh CLI 已预安装并带 GITHUB_TOKEN）
          LAST_SUCCESS=$(gh run list \
            --workflow "${{ github.workflow }}" \
            --branch master \
            --status success \
            --limit 1 \
            --json headSha \
            --jq '.[0].headSha // ""')
          echo "上次成功构建 SHA: ${LAST_SUCCESS:-（无）}"

          if [ -n "$LAST_SUCCESS" ] && [ "$LAST_SUCCESS" = "$HEAD_SHA" ]; then
            echo "::notice::master 自上次成功构建后无新提交，跳过本次 nightly"
            echo "SKIP_BUILD=1" >> "$GITHUB_ENV"
          fi

      # 从 Secrets 还原正式签名证书：四项齐备才签名；缺任意一项则打未签名包。
      # fork / 未配置证书的仓库走这条路，仍能产出可下载的 APK。
      - name: Restore release keystore
        if: env.SKIP_BUILD != '1'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          missing=
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::notice::未配置签名 Secrets（$missing），将产出未签名 release APK"
            echo "SIGNED_APK=0" >> "$GITHUB_ENV"
            exit 0
          fi
          KEYSTORE_FILE="$RUNNER_TEMP/yunx-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
          echo "YUNX_KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "SIGNED_APK=1" >> "$GITHUB_ENV"
          echo "::notice::发布签名证书已就绪（别名 $KEY_ALIAS）"

      - name: Build release APK
        if: env.SKIP_BUILD != '1'
        env:
          YUNX_USE_MIRROR: 'false'
          YUNX_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          YUNX_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          YUNX_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK
        if: env.SKIP_BUILD != '1'
        run: |
          set -e
          SIGNED=app/build/outputs/apk/release/app-release.apk
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          if [ "${SIGNED_APK:-0}" = "1" ]; then
            if [ ! -f "$SIGNED" ]; then
              echo "::error::未找到已签名产物 $SIGNED"
              exit 1
            fi
            SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
            APKSIGNER=$(ls "$SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
            "$APKSIGNER" verify --print-certs "$SIGNED" | head -6
            echo "APK_PATH=$SIGNED" >> "$GITHUB_ENV"
          else
            if [ ! -f "$UNSIGNED" ]; then
              echo "::error::未找到未签名产物 $UNSIGNED"
              exit 1
            fi
            echo "::notice::使用未签名产物 $UNSIGNED"
            echo "APK_PATH=$UNSIGNED" >> "$GITHUB_ENV"
          fi

      - name: Resolve artifact name (date-shortSHA)
        if: env.SKIP_BUILD != '1'
        run: |
          echo "ARTIFACT_NAME=YunX-nightly-$(date +%Y%m%d)-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Upload APK as artifact
        if: env.SKIP_BUILD != '1'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
